name: localio

services:
  data:
    build: ./data
    volumes:
      # Bind mounts, not named volumes: a named volume keeps old GeoJSON
      # between runs, and the map would quietly show stale numbers.
      - ./seed_data:/app/seed_data:ro
      - ./output:/app/output

  web:
    build: ./web
    ports:
      # Port 8080 taken? Run with LOCALIO_PORT=8090 docker compose up
      - "${LOCALIO_PORT:-8080}:80"
    environment:
      # Optional. Set it in .env (see .env.example) to get CARTO Positron tiles.
      LOCALIO_CARTO_KEY: ${LOCALIO_CARTO_KEY:-}
    volumes:
      - ./output:/srv/localio-data:ro
    depends_on:
      data:
        condition: service_completed_successfully

  # One-off, needs network: rebuilds seed_data/catchments.geojson.
  # Run with: docker compose run --rm catchments
  catchments:
    build: ./tools/catchments
    profiles: ["tools"]
    volumes:
      - ./data/localio:/app/localio:ro
      - ./seed_data:/app/seed_data
