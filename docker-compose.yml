name: localio

services:
  data:
    build: ./data
    volumes:
      # Bind mounts, not named volumes: a named volume keeps old GeoJSON
      # between runs, and the map would quietly show stale numbers.
      - ./seed_data:/app/seed_data:ro
      - ./output:/app/output

  web:
    build: ./web
    ports:
      # Port 8080 taken? Run with LOCALIO_PORT=8090 docker compose up
      - "${LOCALIO_PORT:-8080}:80"
    environment:
      # Optional. Set it in .env (see .env.example) to get CARTO Positron tiles.
      LOCALIO_CARTO_KEY: ${LOCALIO_CARTO_KEY:-}
    volumes:
      - ./output:/srv/localio-data:ro
    depends_on:
      data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      # Optional. Without a key the chat answers from templates.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOCALIO_GEMINI_MODEL: ${LOCALIO_GEMINI_MODEL:-gemini-3.8-flash}
      LOCALIO_LLM: ${LOCALIO_LLM:-}
    volumes:
      - ./output:/srv/localio-data:ro
    depends_on:
      data:
        condition: service_completed_successfully

  # End-to-end and visual tests, run by make e2e / make verify.
  e2e:
    build: ./tests/e2e
    profiles: ["test"]
    environment:
      BASE_URL: http://web
      CI: ${CI:-}
    volumes:
      # Mounted so baseline updates (make e2e-update) land in the repo.
      - ./tests/e2e/specs:/e2e/specs
      - ./tests/e2e/test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  # One-off, needs network: rebuilds seed_data/catchments.geojson.
  # Run with: docker compose run --rm catchments
  catchments:
    build: ./tools/catchments
    profiles: ["tools"]
    volumes:
      - ./data/localio:/app/localio:ro
      - ./seed_data:/app/seed_data
