name: localio

services:
  # A throwaway PostGIS for the pipeline's spatial joins. tmpfs, not a
  # volume: every run starts from an empty database, so nothing stale
  # can leak between runs. It's local-only; the password isn't a secret.
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: localio
      POSTGRES_PASSWORD: localio
      POSTGRES_DB: localio
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localio -d localio"]
      interval: 3s
      timeout: 3s
      retries: 20

  data:
    build: ./data
    environment:
      LOCALIO_DB: postgresql://localio:localio@db:5432/localio
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind mounts, not named volumes: a named volume keeps old GeoJSON
      # between runs, and the map would quietly show stale numbers.
      - ./seed_data:/app/seed_data:ro
      - ./output:/app/output

  web:
    build: ./web
    ports:
      # Port 8080 taken? Run with LOCALIO_PORT=8090 docker compose up
      - "${LOCALIO_PORT:-8080}:80"
    environment:
      # Optional. Set it in .env (see .env.example) to get CARTO Positron tiles.
      LOCALIO_CARTO_KEY: ${LOCALIO_CARTO_KEY:-}
    volumes:
      - ./output:/srv/localio-data:ro
    depends_on:
      data:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      # Optional. Without a key the chat answers from templates.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOCALIO_GEMINI_MODEL: ${LOCALIO_GEMINI_MODEL:-gemini-3.8-flash}
      LOCALIO_LLM: ${LOCALIO_LLM:-}
    volumes:
      - ./output:/srv/localio-data:ro
    depends_on:
      data:
        condition: service_completed_successfully

  # End-to-end and visual tests, run by make e2e / make verify.
  e2e:
    build: ./tests/e2e
    profiles: ["test"]
    environment:
      BASE_URL: http://web
      CI: ${CI:-}
    volumes:
      # Mounted so baseline updates (make e2e-update) land in the repo.
      - ./tests/e2e/specs:/e2e/specs
      - ./tests/e2e/test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  # One-off tools that need network access and write to seed_data/.
  # docker compose run --rm osm [--refresh]   OpenStreetMap places and context
  # docker compose run --rm population        residents per ward
  osm:
    build: ./tools/geo
    profiles: ["tools"]
    entrypoint: ["python", "fetch_osm.py"]
    volumes:
      - ./seed_data:/app/seed_data

  population:
    build: ./tools/geo
    profiles: ["tools"]
    entrypoint: ["python", "build_population.py"]
    volumes:
      - ./seed_data:/app/seed_data
