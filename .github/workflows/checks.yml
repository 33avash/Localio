# Runs the whole Compose stack on a clean Ubuntu machine for every pull
# request and every push to main: the pipeline's checks, both pytest
# suites, the chat evaluation, live calls through nginx and the Playwright
# tests. `make verify` runs the same checks locally.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose:
    name: Build and run with Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCALIO_LLM: offline
    steps:
      - uses: actions/checkout@v5

      - name: Pipeline tests (with PostGIS)
        run: docker compose run --rm data python -m pytest -q -p no:cacheprovider tests

      - name: Build, run the pipeline and start the site and the API
        # web and api wait for data to exit 0, so this fails if any check fails.
        run: docker compose up --build --detach --wait web api

      - name: Pipeline log
        if: always()
        run: docker compose logs data

      - name: Site and data are served
        run: |
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8080/data/wards.geojson \
            | python3 -c "import json, sys; n = len(json.load(sys.stdin)['features']); print(n, 'wards'); assert n == 140"
          curl -fsS http://localhost:8080/data/pois.geojson \
            | python3 -c "import json, sys; n = len(json.load(sys.stdin)['features']); print(n, 'outlets'); assert n > 1200"
          curl -fsS http://localhost:8080/data/rent.json \
            | python3 -c "import json, sys; r = json.load(sys.stdin); print('typical rent', r['typical_psf'])"

      - name: API tests and the labelled chat questions
        run: |
          docker compose run --rm --no-deps api python -m pytest -q -p no:cacheprovider tests
          docker compose run --rm --no-deps api python -m localio_api.evaluate

      - name: Chat answers through nginx
        run: |
          curl -fsS -X POST http://localhost:8080/api/ask -H 'Content-Type: application/json' \
            -d '{"question": "Tell me about Koregaon Park"}' \
            | python3 -c "import json, sys; r = json.load(sys.stdin); print(r['answer']); assert r['cited'] == ['Koregaon Park']"
          curl -fsS -X POST http://localhost:8080/api/ask -H 'Content-Type: application/json' \
            -d '{"question": "who won the world cup"}' \
            | python3 -c "import json, sys; r = json.load(sys.stdin); print(r['answer']); assert r['refused']"

      - name: End-to-end and visual tests
        env:
          CI: "true"
        run: docker compose --profile test run --rm --build e2e

      - name: Keep Playwright's diffs if a test failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: tests/e2e/test-results/

      - name: Stop
        if: always()
        run: docker compose down
