server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/geo+json application/javascript text/css;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pipeline output, bind-mounted from ./output. Never cached: after a
    # re-run the browser has to show the new numbers, not the last ones.
    location /data/ {
        alias /srv/localio-data/;
        add_header Cache-Control "no-store";
        types {
            application/geo+json geojson;
        }
    }
}
