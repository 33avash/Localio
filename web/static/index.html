<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localio · Where to open a cafe or QSR in Pune</title>
  <meta name="description" content="Find the Pune wards that are busy but short of cafes or QSRs, what rent to expect there, and ask questions about any ward.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/localio.css">
</head>
<body>
  <aside class="panel" id="panel">
    <button class="sheet-handle" id="sheet-handle" aria-expanded="false" aria-controls="panel"
      aria-label="Expand panel"></button>
    <header class="panel-head">
      <div class="brand-row">
        <p class="brand">Localio</p>
        <button class="text-button" data-action="method">How it works</button>
      </div>
      <p class="tagline">Where to open a cafe or QSR in Pune</p>
      <div class="tabs" role="tablist" aria-label="Views">
        <button class="tab" role="tab" id="tab-plan" aria-controls="panel-body" data-action="tab" data-value="plan">Plan</button>
        <button class="tab" role="tab" id="tab-ask" aria-controls="panel-body" data-action="tab" data-value="ask">Ask</button>
      </div>
    </header>
    <div class="panel-body" id="panel-body" role="tabpanel">
      <div class="skeleton" aria-busy="true" aria-label="Loading Pune's wards">
        <span class="sk sk-title"></span>
        <span class="sk sk-line"></span>
        <span class="sk sk-line sk-short"></span>
        <span class="sk sk-option"></span>
        <span class="sk sk-option"></span>
      </div>
    </div>
    <footer class="panel-foot" id="panel-foot" hidden></footer>
    <section class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden></section>
  </aside>
  <main id="map" aria-label="Map of Pune's wards"></main>

  <script>
    // Browsers block module scripts and fetch() on file://, so app.js would
    // never run. Say so instead of loading forever.
    if (location.protocol === "file:") {
      document.getElementById("panel-body").innerHTML =
        '<div class="status" role="alert"><p class="status-title">Localio has to be served over HTTP.</p>' +
        "<p>Run <code>docker compose up</code> and open http://localhost:8080 instead of the file.</p></div>";
    }
  </script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
